<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscrição</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style/style.css">
</head>

<body>

    <header>
        <nav></nav>
    </header>

    <main>
    <section class="cartao">

        <h1>Inscrição</h1>

        <h2>Palestra sobre a História da Colonização na Austrália</h2>

        <h4>Preencha as Informações Abaixo:</h4>

        <form>

            <div class="campo">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail">
            </div>

            <div class="campo">
                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento">
            </div>

            <div class="campo">
                <label for="ingresso">Tipo de ingresso:</label>

                <select id="ingresso" name="ingresso">
                    <option value="selecione">Selecione uma opção</option>
                    <option value="meia">Meia-entrada</option>
                    <option value="inteira">Inteira</option>
                    <option value="vip">VIP</option>
                </select>
            </div>

            <div class="campo">
                <label for="observacao">Alguma observação?</label>

                <textarea
                    id="observacao"
                    name="observacao"
                    rows="5"
                    placeholder="Digite alguma observação..."></textarea>
            </div>

            <button id="reset" type="reset">Limpar</button>
            <button id="submit" type="submit">Enviar</button>

        </form>

    </section>
</main>
